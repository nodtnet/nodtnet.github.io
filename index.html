<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nodt | blog</title>
    <style>
        body {
            margin: 0;
            padding: 20px 50px;
            background-color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            color: #0000ff;
            /* Ensure the image path is correct or use a placeholder */
            background-image: url('media/images/notebook.jpg');
            background-repeat: repeat;
        }

        /* --- Header Styles --- */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: flex-start; 
            gap: 70px; 
            border-bottom: 2px solid #0000ff;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .logo-container img {
            height: 55px; 
            width: auto;
            display: block;
        }

        .taskbar {
            display: flex;
            gap: 45px; 
        }

        .taskbar a {
            text-decoration: none;
            color: #0000ff;
            font-size: 26px;
            font-weight: normal;
            transition: color 0.2s;
        }

        .taskbar a:hover {
            color: #00008b; 
            text-decoration: underline;
        }

        /* --- Blog Layout --- */
        .container {
            display: flex;
            gap: 50px;
        }

        /* Sidebar/Site Map */
        .sitemap {
            min-width: 200px;
        }

        .sitemap h2 {
            text-decoration: underline;
            font-size: 28px;
            margin-top: 0;
        }

        .sitemap ul {
            list-style-type: none;
            padding-left: 10px;
        }

        .sitemap li {
            margin-bottom: 15px;
        }

        .sitemap a {
            color: #0000ff;
            text-decoration: none;
            font-size: 20px;
        }

        .sitemap a:hover {
            text-decoration: italic;
            font-weight: bold;
        }

        /* Main Content Area */
        .content-area {
            flex-grow: 1;
            border-left: 1px solid #0000ff;
            padding-left: 40px;
        }

        h1 {
            font-style: italic;
            font-weight: normal;
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .container {
                flex-direction: column;
            }
            .content-area {
                border-left: none;
                border-top: 1px solid #0000ff;
                padding-left: 0;
                padding-top: 20px;
            }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="logo-container">
            <img src="media/images/nodt.png" alt="NODT Logo">
        </div>
        
        <nav class="taskbar">
            <a href="index.html">home</a>
            <a href="repository.html">repository</a>
            <a href="contact.html">contact</a>
        </nav>
    </header>

    <div class="container">
        <aside class="sitemap">
            <h2>Information</h2>
            <ul>
                <li><a href="post1.html">- nodt</a></li>
                <li><a href="post2.html">- object detection</a></li>
                <li><a href="post3.html">- blog post 3</a></li>
            </ul>
            
            <br>
        </aside>

        <main class="content-area">
            <h1>hello! please choose a category to continue.</h1>
            <p>Welcome to the nodt blog. Select a link from the site map on the left to read more.</p>
        </main>
    </div>

</body>
</html>
